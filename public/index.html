<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Companion</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23c67b5c'/></svg>" />
</head>
<body data-state="idle">
  <main class="app">
    <section class="stage-wrap">
      <header class="top">
        <div>
          <h1 id="name">Companion</h1>
          <p id="connectors" class="muted"></p>
        </div>
        <div class="top-actions">
          <select id="voice" aria-label="Voice"></select>
          <button id="mute" class="icon" aria-pressed="false" title="Mute voice" aria-label="Mute voice">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
          </button>
          <button id="reset" class="icon" title="New conversation" aria-label="New conversation">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
          </button>
        </div>
      </header>
      <div id="stage" class="stage" title="Tap to interrupt"></div>
      <div class="status-row">
        <span id="status" class="status" aria-live="polite">Ready</span>
        <span id="tool" class="tool" hidden></span>
      </div>
      <div id="pomo-slot"></div>
    </section>

    <section class="chat">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="composer" class="composer">
        <button type="button" id="talk-mode" class="pill" aria-pressed="false" title="Hands-free: keep listening after each reply">Talk mode</button>
        <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
        <button type="button" id="mic" class="icon mic" aria-pressed="false" title="Speak" aria-label="Speak">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="submit" class="icon send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7-8-1z"/></svg>
        </button>
      </form>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
